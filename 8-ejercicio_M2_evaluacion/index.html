    <h1>¿Qué es la Ciberseguridad?</h1>
    <img src="./img/ciber.jpg" alt="">
    <p>La ciberseguridad es la práctica de proteger sistemas digitales, redes, dispositivos y datos de ataques maliciosos, acceso no autorizado y daños. En nuestra era digital interconectada, se ha vuelto fundamental tanto para individuos como para organizaciones.</p>
